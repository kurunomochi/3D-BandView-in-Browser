# Include inside your existing HTTPS VirtualHost; retain your domain and TLS config.
# Requires mod_proxy and mod_proxy_http. Both deployment examples use port 3001.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass / http://127.0.0.1:3001/ connectiontimeout=5 timeout=600
ProxyPassReverse / http://127.0.0.1:3001/
LimitRequestBody 104857600
